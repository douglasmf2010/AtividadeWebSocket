<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="sock-connection.js" defer></script>
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="cadastro">
        <h1>Cadastro</h1>
        <br>
        <h3>Úsuario</h3>
        <input type="text" id="user">
        <h3>Telefone</h3>
        <input type="text" id="telefone">
        <h3>Senha</h3>
        <input type="text" id="senha">
        <br>
        <br>
        <button id="cadastrar">Cadastrar</button>
        <br>
        <a onclick="trocarDiv()">Já tenho uma conta</a>
    </div>
    <div id="login" style="display: none;">
        <h1>login</h1>
        <br>
        <h3>Úsuario</h3>
        <input type="text" id="user">
        <h3>Senha</h3>
        <input type="text" id="senha">
        <br>
        <br>
        <button id="logar">Logar</button>
        <br>
        <a onclick="trocarDiv()">Não tenho uma senha</a>
    </div>
    <script>
        function trocarDiv() {
            const cadastrar = document.getElementById("cadastro");
            const logar = document.getElementById("login");
            if(cadastrar.style.display === "none"){
                cadastrar.style.display = "block";
                logar.style.display = "none";
            }else {
                cadastrar.style.display = "none";
                logar.style.display = "block";
            }
        }
    </script>
</body>
</html>
